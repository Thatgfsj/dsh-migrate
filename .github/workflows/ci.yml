name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unit tests
        run: node --test "test/**/*.test.mjs"

      # The `runner` context is only available inside steps, never at job level.
      - name: Guard against touching a real DSH home
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/assert-isolated-home.mjs

      - name: Platform self-check
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/selfcheck.mjs

      - name: Package dry run
        run: npm pack --dry-run

  lts:
    name: ci / node22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test "test/**/*.test.mjs"
      - name: Guard against touching a real DSH home
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/assert-isolated-home.mjs

  # Compatibility channel for the DSH `next` dist-tag. Not part of the required
  # checks (branch protection gates ci / linux, ci / windows, ci / macos), so a
  # broken upstream prerelease shows up as a red job without blocking main.
  # Every step lives in scripts/compat-check.sh — local runs use the same file.
  compat-next:
    name: ci / compat-next
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Installs @deepseek-ai/dsh@next into $RUNNER_TEMP, runs the real-runtime
      # integration test, composes a web profile with this plugin, then boots it
      # on a random port and probes /api/dsh-migrate/state.
      - name: Compat smoke against dsh@next
        env:
          DSH_NEXT_PREFIX: ${{ runner.temp }}/dsh-next
        run: bash scripts/compat-check.sh
