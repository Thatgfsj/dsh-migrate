name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build package zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests
        run: node --test "test/**/*.test.mjs"
      - name: Build dist zip (dogfoods lib/core/zip.mjs)
        run: node scripts/build-package.mjs
      - name: Build UI-installable tarball
        run: node scripts/pack-tarball.mjs
      - name: Show artifacts
        run: |
          ls -l dist
          unzip -l dist/*.zip | tail -5
          tar -tzf dist/*.tgz | head -12
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-migrate-artifacts
          path: |
            dist/*.zip
            dist/*.tgz
          if-no-files-found: error

  verify-windows:
    name: verify zip on windows
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: dsh-migrate-artifacts
          path: dist
      - name: Expand with PowerShell and check the payload
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath expanded -Force
          $root = Get-ChildItem expanded -Directory | Select-Object -First 1
          foreach ($rel in @('package.json','install.cmd','install.sh','lib/index.js','lib/client.js','skills/dsh-migration/SKILL.md','locale/zh.json','tools/restore.mjs','cordis.patch.yml','icon.svg')) {
            if (-not (Test-Path (Join-Path $root.FullName $rel))) { throw "missing `$rel` in the package zip" }
          }
          node --check (Join-Path $root.FullName 'lib/index.js')
          Write-Host "windows verify ok: $($root.Name)"

  verify-macos:
    name: verify zip on macos
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-migrate-artifacts
          path: dist
      - name: unzip -t and check the executable bit
        run: |
          set -euo pipefail
          zip_file=$(ls dist/*.zip | head -1)
          unzip -t "$zip_file"
          mkdir -p expanded && unzip -q "$zip_file" -d expanded
          root=$(ls -d expanded/*/ | head -1)
          test -f "${root}lib/index.js"
          test -f "${root}skills/dsh-migration/SKILL.md"
          test -x "${root}tools/restore.sh"
          echo "macos verify ok: ${root}"

  publish:
    name: publish github release
    runs-on: ubuntu-latest
    needs: [build, verify-windows, verify-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-migrate-artifacts
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.tgz \
            --title "dsh-migrate ${GITHUB_REF_NAME}" \
            --generate-notes
